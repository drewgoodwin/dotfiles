onboarding = false

[theme]
name = "gruvbox"

[keys]
split_vertical = "prefix+%"
split_horizontal = 'prefix+"'

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"

[[keys.command]]
key = "prefix+ctrl+y"
type = "popup"
command = "lazygit"
description = "run lazygit"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+="
type = "shell"
command = "python3 ~/.config/herdr/scripts/equalize.py vertical"
description = "equalize stacked pane heights"

[[keys.command]]
key = "prefix+minus"
type = "shell"
command = "python3 ~/.config/herdr/scripts/equalize.py horizontal"
description = "equalize side-by-side pane widths"

[session]
resume_agents_on_restore = true

[ui.toast]
delivery = "system"

[ui.toast.herdr]
position = "bottom-right"

[ui.sound]
enabled = true

[experimental]
kitty_graphics = true

[ui]
agent_panel_sort = "priority"

[ui.sidebar.spaces]
row_gap = 1
rows = [
  ["$num", "state_icon", "workspace"],
  ["branch", "git_status"],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
  ["state_icon", "agent", "state_text"],
  ["workspace", "tab"],
]
